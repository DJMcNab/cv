name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install typst
        uses: taiki-e/install-action@v2
        with:
          tool: typst-cli@0.13.1

      - name: Build CV
        run: bash ./build.bash
